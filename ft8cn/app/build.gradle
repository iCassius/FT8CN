import java.text.DateFormat
import java.text.SimpleDateFormat
import java.util.Properties

plugins {
    id 'com.android.application'
}

def versionNameValue = rootProject.findProperty("ft8cn.versionName")?.toString()
def versionCodeValue = rootProject.findProperty("ft8cn.versionCode")?.toString()
def oracleGitCommitValue = rootProject.findProperty("ft8cn.oracleGitCommit")?.toString() ?: "unknown"
def oracleGitDirtyValue = rootProject.findProperty("ft8cn.oracleGitDirty")?.toString() ?: "unknown"
if (!versionNameValue || !versionCodeValue) {
    throw new GradleException("Missing canonical ft8cn.versionName/ft8cn.versionCode in ft8cn/gradle.properties")
}

def canonicalVersionMatch = versionNameValue =~ /^(\d+)\.(\d+)\.(\d{3})$/
def betaVersionMatch = versionNameValue =~ /^(\d+)\.(\d+)\.(\d{3})-beta\.(\d+)$/
def isCanonicalVersion = canonicalVersionMatch.matches()
def isBetaVersion = betaVersionMatch.matches()
if (!isCanonicalVersion && !isBetaVersion) {
    throw new GradleException("ft8cn.versionName must use MAJOR.MINOR.BUILD or MAJOR.MINOR.BUILD-beta.N: ${versionNameValue}")
}
if (!(versionCodeValue ==~ /^\d+$/)) {
    throw new GradleException("ft8cn.versionCode must contain only decimal digits: ${versionCodeValue}")
}
if (!(oracleGitCommitValue == "unknown" || oracleGitCommitValue ==~ /(?i)[0-9a-f]{40}/)) {
    throw new GradleException("ft8cn.oracleGitCommit must be a 40-character Git commit or unknown")
}
if (!(oracleGitDirtyValue in ["true", "false", "unknown"])) {
    throw new GradleException("ft8cn.oracleGitDirty must be true, false, or unknown")
}
if (isCanonicalVersion) {
    def expectedVersionCode = (canonicalVersionMatch[0][1] as int) * 10000 + (canonicalVersionMatch[0][2] as int) * 1000 + (canonicalVersionMatch[0][3] as int)
    if (versionCodeValue.toInteger() != expectedVersionCode) {
        throw new GradleException("ft8cn.versionCode ${versionCodeValue} does not match ft8cn.versionName ${versionNameValue}; expected ${expectedVersionCode}")
    }
}

def currentTime = getCurrentTime()
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def envOrProperty = { envName, propertyName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return keystoreProperties[propertyName]
}

def releaseStoreFile = envOrProperty("FT8CN_RELEASE_STORE_FILE", "storeFile")
def releaseStorePassword = envOrProperty("FT8CN_RELEASE_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = envOrProperty("FT8CN_RELEASE_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = envOrProperty("FT8CN_RELEASE_KEY_PASSWORD", "keyPassword")
def releaseCertSha256 = envOrProperty("FT8CN_RELEASE_CERT_SHA256", "releaseCertSha256")
def betaStoreFile = envOrProperty("FT8CN_BETA_STORE_FILE", "betaStoreFile")
def betaStorePassword = envOrProperty("FT8CN_BETA_STORE_PASSWORD", "betaStorePassword")
def betaKeyAlias = envOrProperty("FT8CN_BETA_KEY_ALIAS", "betaKeyAlias")
def betaKeyPassword = envOrProperty("FT8CN_BETA_KEY_PASSWORD", "betaKeyPassword")
def betaCertSha256 = envOrProperty("FT8CN_BETA_CERT_SHA256", "betaCertSha256")
def hasReleaseSigning = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
        releaseCertSha256
].every { it != null && !it.toString().trim().isEmpty() } &&
        releaseCertSha256.toString() ==~ /(?i)[0-9a-f]{64}/
def hasBetaSigning = [
        betaStoreFile,
        betaStorePassword,
        betaKeyAlias,
        betaKeyPassword,
        betaCertSha256
].every { it != null && !it.toString().trim().isEmpty() } &&
        betaCertSha256.toString() ==~ /(?i)[0-9a-f]{64}/
def releaseStorePath = hasReleaseSigning ? rootProject.file(releaseStoreFile.toString()) : null
def betaStorePath = hasBetaSigning ? rootProject.file(betaStoreFile.toString()) : null
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}
def betaTaskRequested = gradle.startParameter.taskNames.any {
    def taskName = it.toLowerCase(Locale.ROOT)
    taskName.contains("packagetestapk") || taskName.contains("assemblebeta") || taskName.contains("lintbeta") || taskName.contains("compilebeta")
} || rootProject.findProperty("ft8cn.betaBuild")?.toString() == "true"
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException("Release signing is required. Set the four FT8CN_RELEASE_* signing values plus FT8CN_RELEASE_CERT_SHA256, or provide a complete ft8cn/keystore.properties. Debug signing or an untrusted certificate is never valid for release.")
}
if (releaseTaskRequested && !releaseStorePath.isFile()) {
    throw new GradleException("Release keystore does not exist: ${releaseStorePath.absolutePath}")
}
if (betaTaskRequested && !isBetaVersion) {
    throw new GradleException("Beta prerelease builds require -Pft8cn.versionName=MAJOR.MINOR.BUILD-beta.N and -Pft8cn.versionCode=<beta version code>; canonical formal version properties remain unchanged.")
}
if (betaTaskRequested && !hasBetaSigning) {
    throw new GradleException("Beta prerelease signing is required. Set FT8CN_BETA_STORE_FILE, FT8CN_BETA_STORE_PASSWORD, FT8CN_BETA_KEY_ALIAS, FT8CN_BETA_KEY_PASSWORD, and FT8CN_BETA_CERT_SHA256. Android Debug signing is not valid for a tagged beta.")
}
if (betaTaskRequested && !betaStorePath.isFile()) {
    throw new GradleException("Beta keystore does not exist: ${betaStorePath.absolutePath}")
}
gradle.taskGraph.whenReady { graph ->
    def releaseInGraph = graph.allTasks.any {
        it.path.toLowerCase(Locale.ROOT).contains("release")
    }
    if (releaseInGraph && !hasReleaseSigning) {
        throw new GradleException("A formal release task was requested without complete signing configuration. Debug signing is never valid for release.")
    }
    def betaInGraph = graph.allTasks.any {
        def taskName = it.path.toLowerCase(Locale.ROOT)
        taskName.contains("packagetestapk") || taskName.contains("assemblebeta") || taskName.contains("lintbeta") || taskName.contains("compilebeta")
    }
    if (betaInGraph && (!isBetaVersion || !hasBetaSigning || !betaStorePath.isFile())) {
        throw new GradleException("A beta prerelease task requires a beta.N version and a complete beta-only keystore configuration. Debug signing is never valid for a tagged beta.")
    }
}

static def getCurrentTime() {
    DateFormat df = new SimpleDateFormat("yyyy-MM-dd")
    return df.format(Calendar.getInstance(Locale.CHINA).getTime())
}


android {

    compileSdk 34

    buildFeatures {
        buildConfig true
        dataBinding true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        if (hasBetaSigning) {
            beta {
                storeFile rootProject.file(betaStoreFile)
                storePassword betaStorePassword
                keyAlias betaKeyAlias
                keyPassword betaKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.bg7yoz.ft8cn"
        minSdk 23
        targetSdk 34
        versionCode versionCodeValue.toInteger()
        versionName versionNameValue
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField("String", "ORACLE_GIT_COMMIT", "\"${oracleGitCommitValue}\"")
        buildConfigField("String", "ORACLE_GIT_DIRTY", "\"${oracleGitDirtyValue}\"")

        externalNativeBuild {
            cmake {
                cppFlags '-JENABLE_XOM=false'//关闭XOM，

            }
        }
    }

    buildTypes {

        debug{
            //测试版独立包名+独立名称，可与正式版并存安装，数据互不影响
            signingConfig signingConfigs.debug
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            manifestPlaceholders = [appLabel: "FT8CN测试版"]
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")
        }
        beta {
            // Tagged prerelease artifacts use a dedicated persistent beta identity.
            initWith debug
            if (hasBetaSigning) {
                signingConfig signingConfigs.beta
            }
            applicationIdSuffix '.beta'
            versionNameSuffix ''
            manifestPlaceholders = [appLabel: "FT8CN测试版"]
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appLabel: "@string/app_name"]
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
//    externalNativeBuild {
//        cmake {
//            path file('src/main/cpp/CMakeLists.txt')
//            version '3.18.1'
//        }
//    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    namespace 'com.bg7yoz.ft8cn'
}

def verifyBetaSigning = tasks.register("verifyBetaSigning") {
    group = "verification"
    description = "Fail if the beta prerelease signing configuration or beta-only keystore is incomplete."
    doLast {
        def missing = [
                "FT8CN_BETA_STORE_FILE": betaStoreFile,
                "FT8CN_BETA_STORE_PASSWORD": betaStorePassword,
                "FT8CN_BETA_KEY_ALIAS": betaKeyAlias,
                "FT8CN_BETA_KEY_PASSWORD": betaKeyPassword,
                "FT8CN_BETA_CERT_SHA256": betaCertSha256
        ].findAll { entry -> entry.value == null || entry.value.toString().trim().isEmpty() }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("Missing beta signing values: ${missing.join(', ')}. Tagged beta builds cannot use the Android Debug certificate.")
        }
        if (!(betaCertSha256.toString() ==~ /(?i)[0-9a-f]{64}/)) {
            throw new GradleException("FT8CN_BETA_CERT_SHA256 must be exactly 64 hexadecimal characters.")
        }
        def store = rootProject.file(betaStoreFile.toString())
        if (!store.isFile()) {
            throw new GradleException("Beta keystore does not exist: ${store.absolutePath}")
        }
        logger.lifecycle("Beta-only signing configuration is complete; keystore file exists.")
    }
}

def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Fail if the formal release signing configuration or keystore is incomplete."
    doLast {
        def missing = [
                "FT8CN_RELEASE_STORE_FILE/storeFile": releaseStoreFile,
                "FT8CN_RELEASE_STORE_PASSWORD/storePassword": releaseStorePassword,
                "FT8CN_RELEASE_KEY_ALIAS/keyAlias": releaseKeyAlias,
                "FT8CN_RELEASE_KEY_PASSWORD/keyPassword": releaseKeyPassword,
                "FT8CN_RELEASE_CERT_SHA256/releaseCertSha256": releaseCertSha256
        ].findAll { entry -> entry.value == null || entry.value.toString().trim().isEmpty() }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("Missing release signing values: ${missing.join(', ')}. Formal release builds cannot use the debug certificate.")
        }
        if (!(releaseCertSha256.toString() ==~ /(?i)[0-9a-f]{64}/)) {
            throw new GradleException("FT8CN_RELEASE_CERT_SHA256/releaseCertSha256 must be exactly 64 hexadecimal characters.")
        }
        def store = rootProject.file(releaseStoreFile.toString())
        if (!store.isFile()) {
            throw new GradleException("Release keystore does not exist: ${store.absolutePath}")
        }
        logger.lifecycle("Release signing configuration is complete; keystore file exists.")
    }
}

tasks.matching { it.name == "assembleRelease" }.configureEach {
    dependsOn(verifyReleaseSigning)
}

tasks.matching { it.name == "assembleBeta" }.configureEach {
    dependsOn(verifyBetaSigning)
}

tasks.register("printVersion") {
    group = "help"
    description = "Print the canonical FT8CN version name and version code."
    doLast {
        println "${versionNameValue}:${versionCodeValue}"
    }
}

def gitShortCommit = {
    def configuredCommit = System.getenv("GITHUB_SHA") ?: System.getenv("CI_COMMIT_SHA")
    if (configuredCommit != null && configuredCommit ==~ /^[0-9a-fA-F]{7,40}$/) {
        return configuredCommit.substring(0, 7).toLowerCase(Locale.ROOT)
    }
    try {
        def process = new ProcessBuilder("git", "rev-parse", "--short=7", "HEAD")
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.text.trim()
        if (process.waitFor() == 0 && output ==~ /^[0-9a-fA-F]{7}$/) {
            return output.toLowerCase(Locale.ROOT)
        }
    } catch (Exception ignored) {
        // The CI workflow supplies GITHUB_SHA; local builds can still use a stable fallback.
    }
    return "nogit00"
}

tasks.register("packageTestApk") {
    group = "build"
    description = "Build the beta-only signed prerelease APK and copy it to a versioned, commit-addressed artifact."
    dependsOn("assembleBeta")
    doLast {
        def source = file("${project.buildDir}/outputs/apk/beta/app-beta.apk")
        if (!source.isFile()) {
            throw new GradleException("Beta APK was not produced: ${source.absolutePath}")
        }
        def artifactDir = rootProject.file(".artifacts")
        artifactDir.mkdirs()
        def target = new File(artifactDir, "FT8CN-v${versionNameValue}-${gitShortCommit()}.apk")
        java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("BETA prerelease APK: ${target.absolutePath}")
    }
}

