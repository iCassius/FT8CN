import java.text.DateFormat
import java.text.SimpleDateFormat
import java.util.Properties

plugins {
    id 'com.android.application'
}

def currentTime = getCurrentTime()
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def envOrProperty = { envName, propertyName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return keystoreProperties[propertyName]
}

def releaseStoreFile = envOrProperty("FT8CN_RELEASE_STORE_FILE", "storeFile")
def releaseStorePassword = envOrProperty("FT8CN_RELEASE_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = envOrProperty("FT8CN_RELEASE_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = envOrProperty("FT8CN_RELEASE_KEY_PASSWORD", "keyPassword")
def hasReleaseSigning = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.toString().trim().isEmpty() }

static def getCurrentTime() {
    DateFormat df = new SimpleDateFormat("yyyy-MM-dd")
    return df.format(Calendar.getInstance(Locale.CHINA).getTime())
}


android {

    compileSdk 34

    buildFeatures {
        buildConfig true
        dataBinding true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.bg7yoz.ft8cn"
        minSdk 23
        targetSdk 34
        versionCode 93004
        versionName '0.93.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags '-JENABLE_XOM=false'//关闭XOM，

            }
        }
        signingConfig signingConfigs.debug
    }

    buildTypes {

        debug{
            //测试版独立包名+独立名称，可与正式版并存安装，数据互不影响
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            manifestPlaceholders = [appLabel: "FT8CN测试版"]
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appLabel: "@string/app_name"]
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
//    externalNativeBuild {
//        cmake {
//            path file('src/main/cpp/CMakeLists.txt')
//            version '3.18.1'
//        }
//    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    namespace 'com.bg7yoz.ft8cn'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    implementation 'com.google.guava:guava:31.1-jre'//用于HashTable（多key的HashMap）



    implementation files('src/libs/MPAndroidChartv_3.1.0.jar')
    implementation files('src/libs/commons-net-3.6.jar')////用于时间同步
    implementation files('src/libs/nanohttpd-2.2.0.jar')
    implementation files('src/libs/osmdroid-android-6.1.14.aar')//地图控件

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'

}
