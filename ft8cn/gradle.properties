# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Optimized: increased heap size and switched to ParallelGC for better throughput.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable parallel execution and file watching
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.caching=true

# AndroidX settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Configuration Cache (Modern replacement for org.gradle.unsafe.configuration-cache)
org.gradle.configuration-cache=false

# Removed deprecated AGP 10.0 options to clear build warnings
# android.defaults.buildfeatures.resvalues
# android.sdk.defaultTargetSdkToCompileSdkIfUnset
# android.enableAppCompileTimeRClass
# android.usesSdkInManifest.disallowed
# android.uniquePackageNames
# android.r8.strictFullModeForKeepRules
# android.r8.optimizedResourceShrinking
# android.builtInKotlin
# android.newDsl
