name: Android Beta Pre-release APK

on:
  push:
    tags:
      - "v*.*.*-beta.*"

permissions:
  contents: write

jobs:
  build-beta-prerelease:
    name: Build and publish beta pre-release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./ft8cn/gradlew

      - name: Check release contract and sensitive-file hygiene
        run: |
          python scripts/check_release_contract.py
          python scripts/check_release_contract.py --history

      - name: Resolve beta tag and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow must run from a beta tag." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]{3})-beta\.([0-9]+)$ ]]; then
            echo "Tag must be vMAJOR.MINOR.BUILD-beta.N: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          base_version="${BASH_REMATCH[1]}"
          gradle_output="$(./ft8cn/gradlew -p ./ft8cn -q :app:printVersion)"
          gradle_version="$(printf '%s\n' "${gradle_output}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$' | tail -n 1 || true)"
          gradle_version_count="$(printf '%s\n' "${gradle_output}" | grep -Ec '^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$' || true)"
          if [[ "${gradle_version_count}" != "1" || ! "${gradle_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$ || "${gradle_version%%:*}" != "${base_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match canonical Gradle version ${gradle_version}" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [[ -z "${remote_tag_object}" ]]; then
            echo "Remote beta tag ${GITHUB_REF_NAME} is missing." >&2
            exit 1
          fi
          remote_tag_peeled="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk '{print $1}')"
          remote_tag_target="${remote_tag_peeled:-$remote_tag_object}"
          if [[ "${remote_tag_target}" != "${head_sha}" ]]; then
            echo "Remote beta tag ${GITHUB_REF_NAME} does not target the checked-out commit." >&2
            exit 1
          fi
          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/codex/v0.93.005-integration" | awk '{print $1}')"
          if [[ -z "${remote_branch_sha}" || "${remote_branch_sha}" != "${head_sha}" ]]; then
            echo "Beta tag must point exactly at origin/codex/v0.93.005-integration." >&2
            exit 1
          fi
          notes_file="doc/release-notes/${GITHUB_REF_NAME}.md"
          test -f "${notes_file}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${head_sha:0:7}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Run JVM regression tests
        working-directory: ft8cn
        run: |
          ./gradlew :app:testDebugUnitTest --rerun-tasks

      - name: Build versioned beta APK
        id: apk
        working-directory: ft8cn
        shell: bash
        env:
          GITHUB_SHA: ${{ steps.version.outputs.head_sha }}
        run: |
          ./gradlew :app:packageTestApk --rerun-tasks
          apk_path=".artifacts/FT8CN-v${{ steps.version.outputs.base_version }}-beta-${{ steps.version.outputs.short_sha }}.apk"
          test -s "${apk_path}"
          echo "apk_path=ft8cn/${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=$(basename "${apk_path}")" >> "${GITHUB_OUTPUT}"

      - name: Verify beta APK signature
        run: python scripts/verify_apk_signature.py --apk "${{ steps.apk.outputs.apk_path }}" --expect debug

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub pre-release and upload APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          gh release create "${TAG_NAME}" --prerelease --title "FT8CN ${TAG_NAME}" --notes-file "${NOTES_FILE}" "${APK_PATH}"
