name: Android Beta Pre-release APK

on:
  push:
    tags:
      - "v*.*.*-beta.*"

permissions:
  contents: write

jobs:
  build-beta-prerelease:
    name: Build and publish beta pre-release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./ft8cn/gradlew

      - name: Check release contract and sensitive-file hygiene
        run: |
          python scripts/check_release_contract.py
          python scripts/check_release_contract.py --history

      - name: Resolve beta tag and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow must run from a beta tag." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]{3})-beta\.([0-9]+)$ ]]; then
            echo "Tag must be vMAJOR.MINOR.BUILD-beta.N: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          base_version="${BASH_REMATCH[1]}"
          beta_version_name="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" != "v0.93.005-beta.7" ]]; then
            echo "This signing migration workflow currently accepts only v0.93.005-beta.7." >&2
            exit 1
          fi
          beta_version_code="93007"
          gradle_command=(./ft8cn/gradlew -p ./ft8cn -q :app:printVersion)
          gradle_output="$("${gradle_command[@]}" -Pft8cn.versionName="${beta_version_name}" -Pft8cn.versionCode="${beta_version_code}")"
          gradle_version="$(printf '%s\n' "${gradle_output}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]{3}-beta\.[0-9]+:[0-9]+$' | tail -n 1 || true)"
          gradle_version_count="$(printf '%s\n' "${gradle_output}" | grep -Ec '^[0-9]+\.[0-9]+\.[0-9]{3}-beta\.[0-9]+:[0-9]+$' || true)"
          if [[ "${gradle_version_count}" != "1" || "${gradle_version}" != "${beta_version_name}:${beta_version_code}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match beta Gradle version ${gradle_version}" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [[ -z "${remote_tag_object}" ]]; then
            echo "Remote beta tag ${GITHUB_REF_NAME} is missing." >&2
            exit 1
          fi
          remote_tag_peeled="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk '{print $1}')"
          remote_tag_target="${remote_tag_peeled:-$remote_tag_object}"
          if [[ "${remote_tag_target}" != "${head_sha}" ]]; then
            echo "Remote beta tag ${GITHUB_REF_NAME} does not target the checked-out commit." >&2
            exit 1
          fi
          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/codex/v0.93.005-integration" | awk '{print $1}')"
          if [[ -z "${remote_branch_sha}" || "${remote_branch_sha}" != "${head_sha}" ]]; then
            echo "Beta tag must point exactly at origin/codex/v0.93.005-integration." >&2
            exit 1
          fi
          notes_file="doc/release-notes/${GITHUB_REF_NAME}.md"
          test -s "${notes_file}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "beta_version_name=${beta_version_name}" >> "${GITHUB_OUTPUT}"
          echo "beta_version_code=${beta_version_code}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${head_sha:0:7}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Require beta-only signing secrets
        shell: bash
        env:
          FT8CN_BETA_KEYSTORE_B64: ${{ secrets.FT8CN_BETA_KEYSTORE_B64 }}
          FT8CN_BETA_STORE_FILE: ${{ secrets.FT8CN_BETA_STORE_FILE }}
          FT8CN_BETA_STORE_PASSWORD: ${{ secrets.FT8CN_BETA_STORE_PASSWORD }}
          FT8CN_BETA_KEY_ALIAS: ${{ secrets.FT8CN_BETA_KEY_ALIAS }}
          FT8CN_BETA_KEY_PASSWORD: ${{ secrets.FT8CN_BETA_KEY_PASSWORD }}
          FT8CN_BETA_CERT_SHA256: ${{ secrets.FT8CN_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${FT8CN_BETA_KEYSTORE_B64:?Missing secret FT8CN_BETA_KEYSTORE_B64}"
          : "${FT8CN_BETA_STORE_FILE:?Missing secret FT8CN_BETA_STORE_FILE}"
          : "${FT8CN_BETA_STORE_PASSWORD:?Missing secret FT8CN_BETA_STORE_PASSWORD}"
          : "${FT8CN_BETA_KEY_ALIAS:?Missing secret FT8CN_BETA_KEY_ALIAS}"
          : "${FT8CN_BETA_KEY_PASSWORD:?Missing secret FT8CN_BETA_KEY_PASSWORD}"
          : "${FT8CN_BETA_CERT_SHA256:?Missing secret FT8CN_BETA_CERT_SHA256}"
          if [[ "${FT8CN_BETA_STORE_FILE}" == *[\\/]* || "${FT8CN_BETA_STORE_FILE}" == *..* || "${FT8CN_BETA_STORE_FILE}" == .* ]]; then
            echo "FT8CN_BETA_STORE_FILE must be a plain filename." >&2
            exit 1
          fi
          if [[ "${FT8CN_BETA_KEY_ALIAS}" != "ft8cn-beta" ]]; then
            echo "FT8CN_BETA_KEY_ALIAS must be ft8cn-beta." >&2
            exit 1
          fi
          if [[ ! "${FT8CN_BETA_CERT_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "FT8CN_BETA_CERT_SHA256 must be 64 hexadecimal characters." >&2
            exit 1
          fi

      - name: Materialize and verify beta keystore
        id: signing
        shell: bash
        env:
          FT8CN_BETA_KEYSTORE_B64: ${{ secrets.FT8CN_BETA_KEYSTORE_B64 }}
          FT8CN_BETA_STORE_FILE: ${{ secrets.FT8CN_BETA_STORE_FILE }}
          FT8CN_BETA_STORE_PASSWORD: ${{ secrets.FT8CN_BETA_STORE_PASSWORD }}
          FT8CN_BETA_KEY_ALIAS: ${{ secrets.FT8CN_BETA_KEY_ALIAS }}
          FT8CN_BETA_KEY_PASSWORD: ${{ secrets.FT8CN_BETA_KEY_PASSWORD }}
          FT8CN_BETA_CERT_SHA256: ${{ secrets.FT8CN_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/ft8cn-beta-signing"
          mkdir -p "${signing_dir}"
          signing_path="${signing_dir}/${FT8CN_BETA_STORE_FILE}"
          printf '%s' "${FT8CN_BETA_KEYSTORE_B64}" | base64 --decode > "${signing_path}"
          chmod 600 "${signing_path}"
          test -s "${signing_path}"
          keytool_output="$(keytool -list -v -keystore "${signing_path}" -alias "${FT8CN_BETA_KEY_ALIAS}" -storepass "${FT8CN_BETA_STORE_PASSWORD}" -keypass "${FT8CN_BETA_KEY_PASSWORD}")"
          keytool_cert="$(printf '%s\n' "${keytool_output}" | awk -F': ' '/^[[:space:]]*SHA256:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "${keytool_cert}" != "${FT8CN_BETA_CERT_SHA256}" ]]; then
            echo "Beta keystore certificate does not match FT8CN_BETA_CERT_SHA256." >&2
            exit 1
          fi
          apksigner_bin="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner_bin}"
          "${apksigner_bin}" version >/dev/null
          echo "store_path=${signing_path}" >> "${GITHUB_OUTPUT}"

      - name: Run JVM regression tests
        working-directory: ft8cn
        run: |
          ./gradlew :app:testDebugUnitTest --rerun-tasks

      - name: Build versioned beta APK
        id: apk
        working-directory: ft8cn
        shell: bash
        env:
          GITHUB_SHA: ${{ steps.version.outputs.head_sha }}
          FT8CN_BETA_STORE_FILE: ${{ steps.signing.outputs.store_path }}
          FT8CN_BETA_STORE_PASSWORD: ${{ secrets.FT8CN_BETA_STORE_PASSWORD }}
          FT8CN_BETA_KEY_ALIAS: ${{ secrets.FT8CN_BETA_KEY_ALIAS }}
          FT8CN_BETA_KEY_PASSWORD: ${{ secrets.FT8CN_BETA_KEY_PASSWORD }}
          FT8CN_BETA_CERT_SHA256: ${{ secrets.FT8CN_BETA_CERT_SHA256 }}
        run: |
          ./gradlew :app:packageTestApk --rerun-tasks \
            -Pft8cn.versionName="${{ steps.version.outputs.beta_version_name }}" \
            -Pft8cn.versionCode="${{ steps.version.outputs.beta_version_code }}"
          apk_path=".artifacts/FT8CN-v${{ steps.version.outputs.beta_version_name }}-${{ steps.version.outputs.short_sha }}.apk"
          test -s "${apk_path}"
          echo "apk_path=ft8cn/${apk_path}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=$(basename "${apk_path}")" >> "${GITHUB_OUTPUT}"

      - name: Verify beta APK certificate and metadata
        env:
          FT8CN_BETA_CERT_SHA256: ${{ secrets.FT8CN_BETA_CERT_SHA256 }}
        run: |
          python scripts/verify_apk_signature.py --apk "${{ steps.apk.outputs.apk_path }}" --expect beta
          python scripts/verify_apk_metadata.py \
            --apk "${{ steps.apk.outputs.apk_path }}" \
            --package com.bg7yoz.ft8cn.beta \
            --version-name "${{ steps.version.outputs.beta_version_name }}" \
            --version-code "${{ steps.version.outputs.beta_version_code }}" \
            --require-zipalign

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub beta pre-release and upload APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          gh release create "${TAG_NAME}" --prerelease --title "FT8CN ${TAG_NAME}" --notes-file "${NOTES_FILE}" "${APK_PATH}"

      - name: Cleanup beta keystore
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/ft8cn-beta-signing"
          if [[ -d "${signing_dir}" ]]; then
            find "${signing_dir}" -type f -exec shred -u {} + 2>/dev/null || true
            rmdir "${signing_dir}" 2>/dev/null || true
          fi
