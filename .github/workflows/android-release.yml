name: Android Release APK

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./ft8cn/gradlew

      - name: Check release contract and sensitive-file hygiene
        run: python scripts/check_release_contract.py

      - name: Test release certificate gates
        run: python -m unittest scripts.test_release_gates

      - name: Resolve release tag and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow is a formal tag release and must run from a tag." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]{3}$ ]]; then
            echo "Tag must be vMAJOR.MINOR.BUILD with a three-digit build: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gradle_version="$(./ft8cn/gradlew -q :app:printVersion)"
          if [[ "${gradle_version%%:*}" != "${tag_version}" ]]; then
            echo "Tag ${tag_version} does not match canonical Gradle version ${gradle_version}" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [[ -z "${remote_tag_object}" ]]; then
            echo "Remote tag ${GITHUB_REF_NAME} is missing." >&2
            exit 1
          fi
          remote_tag_peeled="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk '{print $1}')"
          remote_tag_target="${remote_tag_peeled:-$remote_tag_object}"
          if [[ "${remote_tag_target}" != "${head_sha}" ]]; then
            echo "Remote tag ${GITHUB_REF_NAME} does not target the checked-out commit; refusing to move/overwrite it." >&2
            exit 1
          fi
          remote_release_sha="$(git ls-remote --heads origin "refs/heads/release" | awk '{print $1}')"
          if [[ -z "${remote_release_sha}" || "${remote_release_sha}" != "${head_sha}" ]]; then
            echo "Formal tag must point exactly at origin/release." >&2
            exit 1
          fi
          notes_file="doc/release-notes/v${tag_version}.md"
          test -f "${notes_file}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "version=${tag_version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${head_sha:0:7}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Hold formal release until user approval and trusted certificate are configured
        shell: bash
        env:
          FT8CN_FORMAL_RELEASE_APPROVED: ${{ secrets.FT8CN_FORMAL_RELEASE_APPROVED }}
          FT8CN_RELEASE_CERT_SHA256: ${{ secrets.FT8CN_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${FT8CN_FORMAL_RELEASE_APPROVED:?Missing secret FT8CN_FORMAL_RELEASE_APPROVED; formal release is blocked until the user explicitly approves signing migration}"
          : "${FT8CN_RELEASE_CERT_SHA256:?Missing secret FT8CN_RELEASE_CERT_SHA256}"
          if [[ "${FT8CN_FORMAL_RELEASE_APPROVED}" != "yes" ]]; then
            echo "Formal release remains blocked; explicit user approval is required." >&2
            exit 1
          fi
          if [[ ! "${FT8CN_RELEASE_CERT_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "FT8CN_RELEASE_CERT_SHA256 must be 64 hexadecimal characters." >&2
            exit 1
          fi

      - name: Materialize formal keystore
        id: signing
        shell: bash
        env:
          FT8CN_RELEASE_STORE_FILE: ${{ secrets.FT8CN_RELEASE_STORE_FILE }}
          FT8CN_RELEASE_STORE_PASSWORD: ${{ secrets.FT8CN_RELEASE_STORE_PASSWORD }}
          FT8CN_RELEASE_KEY_ALIAS: ${{ secrets.FT8CN_RELEASE_KEY_ALIAS }}
          FT8CN_RELEASE_KEY_PASSWORD: ${{ secrets.FT8CN_RELEASE_KEY_PASSWORD }}
          FT8CN_RELEASE_KEYSTORE_B64: ${{ secrets.FT8CN_RELEASE_KEYSTORE_B64 }}
          FT8CN_RELEASE_CERT_SHA256: ${{ secrets.FT8CN_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${FT8CN_RELEASE_STORE_FILE:?Missing secret FT8CN_RELEASE_STORE_FILE}"
          : "${FT8CN_RELEASE_STORE_PASSWORD:?Missing secret FT8CN_RELEASE_STORE_PASSWORD}"
          : "${FT8CN_RELEASE_KEY_ALIAS:?Missing secret FT8CN_RELEASE_KEY_ALIAS}"
          : "${FT8CN_RELEASE_KEY_PASSWORD:?Missing secret FT8CN_RELEASE_KEY_PASSWORD}"
          : "${FT8CN_RELEASE_KEYSTORE_B64:?Missing secret FT8CN_RELEASE_KEYSTORE_B64}"
          : "${FT8CN_RELEASE_CERT_SHA256:?Missing secret FT8CN_RELEASE_CERT_SHA256}"
          if [[ "${FT8CN_RELEASE_STORE_FILE}" == *[\\/]* || "${FT8CN_RELEASE_STORE_FILE}" == *..* || "${FT8CN_RELEASE_STORE_FILE}" == .* ]]; then
            echo "FT8CN_RELEASE_STORE_FILE must be a plain filename, not a repository path." >&2
            exit 1
          fi
          signing_dir="${RUNNER_TEMP}/ft8cn-release-signing"
          mkdir -p "${signing_dir}"
          signing_path="${signing_dir}/${FT8CN_RELEASE_STORE_FILE}"
          printf '%s' "${FT8CN_RELEASE_KEYSTORE_B64}" | base64 --decode > "${signing_path}"
          test -s "${signing_path}"
          echo "store_path=${signing_path}" >> "${GITHUB_OUTPUT}"

      - name: Build release APK
        working-directory: ft8cn
        env:
          FT8CN_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_path }}
          FT8CN_RELEASE_STORE_PASSWORD: ${{ secrets.FT8CN_RELEASE_STORE_PASSWORD }}
          FT8CN_RELEASE_KEY_ALIAS: ${{ secrets.FT8CN_RELEASE_KEY_ALIAS }}
          FT8CN_RELEASE_KEY_PASSWORD: ${{ secrets.FT8CN_RELEASE_KEY_PASSWORD }}
          FT8CN_RELEASE_CERT_SHA256: ${{ secrets.FT8CN_RELEASE_CERT_SHA256 }}
        run: |
          ./gradlew assembleRelease

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_NAME="FT8CN-v${VERSION}-release-${{ steps.version.outputs.short_sha }}.apk"
          APK_PATH="ft8cn/.artifacts/${APK_NAME}"
          mkdir -p ft8cn/.artifacts
          cp ft8cn/app/build/outputs/apk/release/app-release.apk "${APK_PATH}"
          echo "apk_path=${APK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=${APK_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Verify formal APK signature
        env:
          FT8CN_RELEASE_CERT_SHA256: ${{ secrets.FT8CN_RELEASE_CERT_SHA256 }}
        run: python scripts/verify_apk_signature.py --apk "${{ steps.apk.outputs.apk_path }}" --expect release

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          NOTES_FILE="${{ steps.version.outputs.notes_file }}"
          test -f "${NOTES_FILE}"
          gh release create "${TAG_NAME}" --title "FT8CN ${TAG_NAME}" --notes-file "${NOTES_FILE}"
          gh release upload "${TAG_NAME}" "${APK_PATH}"

      - name: Cleanup formal keystore
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP}/ft8cn-release-signing"
          if [[ -d "${signing_dir}" ]]; then
            find "${signing_dir}" -type f -exec shred -u {} + 2>/dev/null || true
            rmdir "${signing_dir}" 2>/dev/null || true
          fi
