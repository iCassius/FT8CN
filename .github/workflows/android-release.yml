name: Android Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        working-directory: ft8cn
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_NAME="FT8CN-v${VERSION}-release.apk"
          APK_PATH="ft8cn/app/build/outputs/apk/release/${APK_NAME}"
          cp ft8cn/app/build/outputs/apk/release/app-release.apk "${APK_PATH}"
          echo "apk_path=${APK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=${APK_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --title "FT8CN ${TAG_NAME}" --notes-file RELEASES.md
          fi
          gh release upload "${TAG_NAME}" "${APK_PATH}" --clobber
