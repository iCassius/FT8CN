name: Android CI

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: ft8cn
      run: chmod +x gradlew
    - name: Check release contract and sensitive-file hygiene
      run: python scripts/check_release_contract.py

    - name: Test release certificate gates
      run: python -m unittest scripts.test_release_gates

    - name: Test native artifact gate implementation
      run: python -m unittest scripts.test_native_artifact_gate

    - name: Resolve canonical Gradle version
      shell: bash
      run: |
        set -euo pipefail
        gradle_output="$(./ft8cn/gradlew -p ./ft8cn -q :app:printVersion)"
        gradle_version="$(printf '%s\n' "${gradle_output}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$' | tail -n 1 || true)"
        gradle_version_count="$(printf '%s\n' "${gradle_output}" | grep -Ec '^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$' || true)"
        if [[ "${gradle_version_count}" != "1" || ! "${gradle_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$ ]]; then
          echo "Could not read one canonical Gradle version from printVersion output." >&2
          exit 1
        fi

    - name: Run JVM unit tests
      working-directory: ft8cn
      run: ./gradlew :app:testDebugUnitTest

    - name: Build ordinary debug APK
      working-directory: ft8cn
      run: ./gradlew :app:assembleDebug

    - name: Verify ordinary debug APK signature
      run: |
        python scripts/verify_apk_signature.py --apk "ft8cn/app/build/outputs/apk/debug/app-debug.apk" --expect debug

    - name: Verify native ABI, JNI, ELF and 16 KB ZIP alignment
      run: |
        python scripts/verify_native_artifact.py \
          --artifact "ft8cn/app/build/outputs/apk/debug/app-debug.apk" \
          --jni-contract scripts/native_jni_contract.json \
          --expected-abis arm64-v8a,armeabi-v7a,x86,x86_64 \
          --zipalign-mode required

    - name: Upload ordinary debug APK
      uses: actions/upload-artifact@v4
      with:
        name: FT8CN-debug-${{ github.sha }}
        path: ft8cn/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
