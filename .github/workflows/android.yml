name: Android CI

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: ft8cn
      run: chmod +x gradlew
    - name: Check release contract and sensitive-file hygiene
      run: python scripts/check_release_contract.py

    - name: Test release certificate gates
      run: python -m unittest scripts.test_release_gates

    - name: Run JVM unit tests
      working-directory: ft8cn
      run: ./gradlew :app:testDebugUnitTest

    - name: Build TEST/BETA APK
      working-directory: ft8cn
      run: ./gradlew :app:packageTestApk

    - name: Verify TEST/BETA APK signature
      run: |
        set -euo pipefail
        gradle_output="$(./ft8cn/gradlew -p ./ft8cn -q :app:printVersion)"
        gradle_version="$(printf '%s\n' "${gradle_output}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$' | tail -n 1 || true)"
        gradle_version_count="$(printf '%s\n' "${gradle_output}" | grep -Ec '^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$' || true)"
        if [[ "${gradle_version_count}" != "1" || ! "${gradle_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]{3}:[0-9]+$ ]]; then
          echo "Could not read one canonical Gradle version from printVersion output." >&2
          exit 1
        fi
        VERSION="${gradle_version%%:*}"
        python scripts/verify_apk_signature.py --apk "ft8cn/.artifacts/FT8CN-v${VERSION}-beta-${GITHUB_SHA:0:7}.apk" --expect debug

    - name: Upload TEST/BETA APK
      uses: actions/upload-artifact@v4
      with:
        name: FT8CN-test-beta-${{ github.sha }}
        path: ft8cn/.artifacts/*.apk
        if-no-files-found: error
